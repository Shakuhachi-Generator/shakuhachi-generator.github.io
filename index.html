<!DOCTYPE html>
<html>
	<head>
		<title>Shakuhachi Generator</title>
		<!-- Meta -->
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="color-scheme" content="only light">
		<meta name="theme-color" content="#FFF5C6">
		<meta name="description" content="Random shakuhachi sheet generator for educational purposes.">
		<meta name="keywords" content="shakuhachi, shakuhachi sheet, sheet generator">
		<meta name="robots" content="noindex, notranslate">   <!-- TODO: replace 'noindex' with 'all' when the page is ready-->
		<meta name='HandheldFriendly' content='True'>
		<meta name="author" content="Kustos Balázs">
		<!-- Style -->
		<link rel="stylesheet" href="style.css">
		<!-- Script -->
		<script src="script.js"></script>
		<script src="generator.js"></script>
	</head>
	<body>
		<div id="settingsControls">
			<div class="align-right"></div>
			<div class="settingsControl" onclick="toggleSettingsWindow()">&#x2699;&#xFE0F;</div>
			<div class="settingsControl" onclick="changeLanguage('hun')">&#x1F1ED;&#x1F1FA;</div>
			<div class="settingsControl" onclick="changeLanguage('eng')">&#x1F1EC;&#x1F1E7;</div>
		</div>
		<div id="settings">
			<div id="notationLabel">
				<span class="lang_hun">Jelölés:</span>
				<span class="lang_eng">Notation:</span>
			</div>
			<input type="radio" id="useKatakana" name="notation" value="katakana" oninput="changeNoteDisplay('katakana')" checked> <label for="useKatakana">katakana</label>
			<input type="radio" id="useRomaji"   name="notation" value="romaji"   oninput="changeNoteDisplay('romaji')"          > <label for="useRomaji"  >romaji</label>
			<br>
			<input type="radio" id="useRi" name="riOrHa" value="ri" oninput="changeRiHa('ri')"        > <label for="useRi">ri</label>
			<input type="radio" id="useHa" name="riOrHa" value="ha" oninput="changeRiHa('ha')" checked> <label for="useHa">ha</label>
			<br>

			<hr>

			<div id="fingerings">
				<span class="lang_hun">Fogások:</span>
				<span class="lang_eng">Fingerings:</span>
			</div>

			<div id="fingeringsKari" class="fingeringCategory">
				<input type="checkbox" id="includeKari" oninput="toggleKariNotes(event)" checked> <label for="includeKari">kari</label>
			</div>
			<div id="fingeringsKariNotes" class="fingeringNotes">
			<input type="checkbox" id="includeRo"  oninput="checkKari()" checked>
				<label for="includeRo"><span class="note_romaji">ro</span><span class="note_katakana">&#x30ED;</span></label>
			<input type="checkbox" id="includeCu"  oninput="checkKari()" checked>
				<label for="includeCu"><span class="note_romaji">cu</span><span class="note_katakana">&#x30C4;</span></label>
			<input type="checkbox" id="includeRe"  oninput="checkKari()" checked>
				<label for="includeRe"><span class="note_romaji">re</span><span class="note_katakana">&#x30EC;</span></label>
			<input type="checkbox" id="includeChi" oninput="checkKari()" checked>
				<label for="includeChi">
					<span class="note_romaji">
						<span class="lang_hun">csi</span>
						<span class="lang_eng">chi</span>
					</span>
					<span class="note_katakana">&#x30C1;</span>
					</label>
			<input type="checkbox" id="includeHa" oninput="checkKari()" checked>
				<label for="includeHa">
					<span class="note_romaji">
						<span class="note_ri">ri</span>
						<span class="note_ha">ha</span>
					</span>
					<span class="note_katakana">
						<span class="note_ri">&#x30EA;</span>
						<span class="note_ha">&#x30CF;</span>
					</span>
				</label>
			<input type="checkbox" id="includeI" oninput="checkKari()" checked>
				<label for="includeI"><span class="note_romaji">i</span><span class="note_katakana">&#x30A4;</span></label>
			</div>

			<div id="fingeringsMeri" class="fingeringCategory">
				<input type="checkbox" id="includeMeri" oninput="toggleMeriNotes(event)" checked> <label for="includeMeri">meri</label>
			</div>
			<div id="fingeringsMeriNotes" class="fingeringNotes">
			<input type="checkbox" id="includeRomeri" oninput="checkMeri()" checked>
				<label for="includeRomeri"><span class="note_romaji">ro meri</span><span class="note_katakana romeri" style="padding-right:17px">&#x30ED;&#x30E1;</span></label>
			<input type="checkbox" id="includeCumeri" oninput="checkMeri()" checked>
				<label for="includeCumeri"><span class="note_romaji">cu meri</span><span class="note_katakana cumeri" style="padding-right:14px">&#x30C4;&#x30E1;</span></label>
			<input type="checkbox" id="includeU"      oninput="checkMeri()" checked>
				<label for="includeU"><span class="note_romaji">u</span><span class="note_katakana">&#x30A6;</span></label>
			</div>

			<hr>

			<div class="setting">
				<label for="numberOfColumns">
					<span class="lang_hun">Oszlopok száma: </span>
					<span class="lang_eng">Number of columns: </span>
				</label>
				<div class="align-right"></div>
				<button class="spinner spinner-decrease" onclick="decreaseValue('numberOfColumns')">-</button>
				<input type="number" id="numberOfColumns" min="1" max="10" value="8"
					   onfocus="selectValue('numberOfColumns')" oninput="clampValue('numberOfColumns')">
				<button class="spinner spinner-increase" onclick="increaseValue('numberOfColumns')">+</button>
			</div>

			<div class="setting">
				<label for="numberOfBreaths">
					<span class="lang_hun">Lélegzetek száma (oszloponként): </span>
					<span class="lang_eng">Number of breaths (per column): </span>
				</label>
				<div class="align-right"></div>
				<button class="spinner spinner-decrease" onclick="decreaseValue('numberOfBreaths')">-</button>
				<input type="number" id="numberOfBreaths" min="1" max="10" value="2"
					   onfocus="selectValue('numberOfBreaths')" oninput="clampValue('numberOfBreaths')">
				<button class="spinner spinner-increase" onclick="increaseValue('numberOfBreaths')">+</button>
			</div>

			<div class="setting">
				<label for="numberOfNotesPerBreath">
					<span class="lang_hun">Fogások száma (lélegzetenként): </span>
					<span class="lang_eng">Number of fingerings (per breath): </span>
				</label>
				<div class="align-right"></div>
				<button class="spinner spinner-decrease" onclick="decreaseValue('numberOfNotesPerBreath')">-</button>
				<input type="number" id="numberOfNotesPerBreath" min="1" max="10" value="4"
					   onfocus="selectValue('numberOfNotesPerBreath')" oninput="clampValue('numberOfNotesPerBreath')">
				<button class="spinner spinner-increase" onclick="increaseValue('numberOfNotesPerBreath')">+</button>
			</div>

			<label for="frequencyOfLongNotes">
				<span class="lang_hun">Hosszú hangok előfordulásának gyakorisága: </span>
				<span class="lang_eng">Frequency of long notes: </span>
			</label>
			<br>
			<input type="range" id="frequencyOfLongNotes" min="0" max="100" value="50" oninput="updateLongNoteFrequencyValueLabel()">
			<span id="longNoteFrequencyValue"></span>
			<br>

			<br>

			<button id="generateButton" onclick="generateRandomSheet()">
				<span class="lang_hun">Generálás</span>
				<span class="lang_eng">Generate</span>
			</button>
		</div>
		<hr id="separator">
		<table id="sheet-table"></table>
	</body>
</html>
